description: Novira Therapeutics was a biopharmaceutical company developing direct-acting antivirals
  for chronic hepatitis B (HBV), notably HBV capsid assembly modulators. It was acquired by Johnson &
  Johnson (Janssen) in 2015 and no longer operates as an independent entity. Its domain
  (noviratherapeutics.com) is now run on Johnson & Johnson DNS and mail infrastructure with no public
  website, developer portal, or API. Surfaced as a portfolio company of canaan-partners; the enrichment
  pipeline confirms there is no API or developer surface to catalog.
